# coturn for Jotra's player host: STUN plus a TURN relay for players that can't connect
# directly. Credentials are time-limited and minted by the lobby (coturn REST API scheme); the
# shared secret comes from TURN_SECRET via --static-auth-secret in docker-compose.yml.
listening-port=3479
min-port=49300
max-port=49399
# The container sits behind Docker's NAT; advertise the host's public address.
external-ip=91.99.227.111
realm=jotra.r4b2.de
use-auth-secret
fingerprint
no-tls
no-dtls
no-cli
no-multicast-peers
# Metrics on :9641 inside the stack only, for a scraper once metrics ship (M10).
prometheus
# Up to 10 players per room, each relayed guest holding an allocation or two; this still caps
# relayed sessions on the small box.
total-quota=100
# Never relay into private or local networks (the host's Docker networks included).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
log-file=stdout
