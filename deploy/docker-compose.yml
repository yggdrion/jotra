# Local dedicated server, built from the Linux export:
#
#   python tools/export.py linux
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  jotra:
    image: jotra-server
    build:
      context: ../build/linux
      dockerfile: ../../deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "17777:17777/udp"
      - "127.0.0.1:9310:9310"
    volumes:
      - world:/data

volumes:
  world:
