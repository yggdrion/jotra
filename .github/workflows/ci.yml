name: CI

# Every job runs the same tools/*.py scripts as the local check (python tools/check.py):
#   1. Lint GDScript   2. gdUnit4 tests (Linux + Windows)   3. Headless network test
#   4. Linux + Windows exports, uploaded as artifacts on every push
#   5. GitHub Release with both zips on `v*` tags

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: gdlint game/scripts game/tests
      - run: gdformat --check game/scripts game/tests

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Run gdUnit4 tests
        run: python tools/run_tests.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdunit4-report-${{ matrix.os }}
          path: game/reports/
          if-no-files-found: ignore
      # A headless server plus bot clients over ENet on localhost.
      - name: Run network test
        run: python tools/run_network_test.py

  # Every push gets a downloadable playtest build. Each platform exports on its own OS.
  export:
    name: export (${{ matrix.platform }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            templates: ~/.local/share/godot/export_templates
          - platform: windows
            os: windows-latest
            templates: ~\AppData\Roaming\Godot\export_templates
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Cache export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.templates }}
          # install.py holds the list of templates we extract.
          key: godot-templates-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512', 'tools/install.py') }}
      - name: Export
        run: python tools/export.py ${{ matrix.platform }}
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jotra-${{ matrix.platform }}-${{ github.sha }}
          path: build/${{ matrix.platform }}/
          if-no-files-found: error

  # The dedicated server image (deploy/Dockerfile) from the Linux build, on main and v* tags.
  # Smoke test: the container must answer on its metrics port.
  docker:
    needs: export
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jotra-linux-${{ github.sha }}
          path: build/linux
      - name: Build
        run: docker build -t jotra-server -f deploy/Dockerfile build/linux
      - name: Smoke test
        run: |
          docker run -d --name jotra -p 9310:9310 jotra-server
          for i in $(seq 20); do
            curl -sf localhost:9310/metrics | grep -q jotra_players && exit 0
            sleep 1
          done
          docker logs jotra
          exit 1
      - name: Push
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/${{ github.repository_owner }}/jotra-server
          tag=${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          for t in "$tag" "sha-${GITHUB_SHA::12}"; do
            docker tag jotra-server "$image:$t" && docker push "$image:$t"
          done

  # A pushed `v*` tag runs the whole pipeline above, then publishes both builds.
  release:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jotra-*-${{ github.sha }}
      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          # Artifacts drop the exec bit; zip keeps it once restored.
          chmod +x "jotra-linux-${{ github.sha }}/jotra.x86_64"
          for p in linux windows; do
            mv "jotra-$p-${{ github.sha }}" "jotra-$p"
            zip -r "jotra-$p-$tag.zip" "jotra-$p"
          done
      - run: >-
          gh release create "${{ github.ref_name }}" jotra-*-"${{ github.ref_name }}".zip
          --repo "${{ github.repository }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
