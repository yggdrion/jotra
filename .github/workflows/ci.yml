name: CI

# Every job runs the same tools/*.py scripts as the local check (python tools/check.py):
#   1. Lint GDScript   2. Lobby tests + container build   3. gdUnit4 tests (Linux + Windows)
#   4. Headless network test (ENet, and WebRTC through a local lobby)
#   5. Linux, Windows and macOS (universal: x86_64 + arm64) exports, uploaded as artifacts on every push
#   6. GitHub Release with all three zips on `v*` tags

on:
  push:
  workflow_dispatch:

env:
  # Tools inside the checkout, where the caches below look for them.
  JOTRA_TOOLS: .tools

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: gdlint game/scripts game/tests
      - run: gdformat --check game/scripts game/tests

  lobby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python tools/run_lobby_tests.py
      - name: Build container
        run: docker build -t jotra-lobby:${{ github.sha }} lobby

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Run gdUnit4 tests
        run: python tools/run_tests.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdunit4-report-${{ matrix.os }}
          path: game/reports/
          if-no-files-found: ignore
      # A headless server plus bot clients over ENet on localhost, then over WebRTC through a
      # local lobby (pinned Bun, downloaded by the script).
      - name: Run network test
        run: python tools/run_network_test.py

  # Every push gets a downloadable playtest build. Linux and Windows export on their own OS; macOS
  # exports from Linux (ad-hoc signed, not notarized).
  export:
    name: export (${{ matrix.platform }})
    needs: [lint, lobby, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            templates: ~/.local/share/godot/export_templates
          - platform: windows
            os: windows-latest
            templates: ~\AppData\Roaming\Godot\export_templates
          - platform: macos
            os: ubuntu-latest
            templates: ~/.local/share/godot/export_templates
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512') }}
      - name: Cache export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.templates }}
          # install.py holds the list of templates we extract.
          key: godot-templates-${{ runner.os }}-${{ hashFiles('.godot-version', 'tools/godot-*.sha512', 'tools/install.py') }}
      - name: Export
        run: python tools/export.py ${{ matrix.platform }}
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jotra-${{ matrix.platform }}-${{ github.sha }}
          path: build/${{ matrix.platform }}/
          if-no-files-found: error

  # A pushed `v*` tag runs the whole pipeline above, then publishes all builds.
  release:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jotra-*-${{ github.sha }}
      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          # Artifacts drop the exec bit; zip keeps it once restored.
          chmod +x "jotra-linux-${{ github.sha }}/jotra.x86_64"
          for p in linux windows; do
            mv "jotra-$p-${{ github.sha }}" "jotra-$p"
            zip -r "jotra-$p-$tag.zip" "jotra-$p"
          done
          # Godot already zips the app bundle, exec bits included.
          mv "jotra-macos-${{ github.sha }}/jotra.zip" "jotra-macos-$tag.zip"
      - run: >-
          gh release create "${{ github.ref_name }}" jotra-*-"${{ github.ref_name }}".zip
          --repo "${{ github.repository }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
